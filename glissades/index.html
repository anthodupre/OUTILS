<!DOCTYPE html>
<html lang="fr-CA" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glissades">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1726">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Glissades PDH · Info terrain</title>
<style>
:root{
  --bg:#e7edf4;--card:#fff;--card2:#f2f6fa;--ink:#0b1726;--mute:#566475;--line:#d0dae5;--acc:#0a5fb4;
  --s0:#8390a0;--s1:#1f6fd6;--s2:#0f8c55;--s3:#d97400;--s4:#d02c24;--ice:#7a3ccf;
  --ok:#0f8c55;--yel:#c49a00;--warn:#d97400;--bad:#d02c24;--info:#1f6fd6;--sim:#8a2be2;
  --scale:1;--gap:.3rem;
}
[data-theme=dark]{
  --bg:#050c16;--card:#0e1b2b;--card2:#13253a;--ink:#eef4fb;--mute:#93a7bb;--line:#1f344c;--acc:#5aa9ff;
  --s0:#5f6c7a;--s1:#3f8ff5;--s2:#20ad6c;--s3:#f0931f;--s4:#f0483f;--ice:#a77bff;
  --ok:#20ad6c;--yel:#d8b21a;--warn:#f0931f;--bad:#f0483f;--info:#5aa9ff;
}
*{box-sizing:border-box}
html{font-size:calc(clamp(10px,min(3.3vw,1.8vh),21px)*var(--scale));-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
#app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;gap:var(--gap);
  padding:max(env(safe-area-inset-top),.3rem) max(env(safe-area-inset-right),.35rem) max(env(safe-area-inset-bottom),.3rem) max(env(safe-area-inset-left),.35rem)}
.mute{color:var(--mute)}
/* En-tête */
header{display:flex;align-items:center;gap:.35rem;flex:0 0 auto}
.brand{font-weight:850;font-size:.98rem;line-height:1;white-space:nowrap}
.brand small{display:block;font-weight:700;font-size:.56rem;color:var(--mute);letter-spacing:.08em;margin-top:.12rem}
.clock{font-weight:850;font-size:1.3rem;margin:0 auto;letter-spacing:-.02em}
.pill{border-radius:99px;padding:.2rem .5rem;font-weight:850;font-size:.7rem;white-space:nowrap;color:#fff;background:var(--s0);max-width:45vw;overflow:hidden;text-overflow:ellipsis}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:.5rem;width:2.1rem;height:2.1rem;display:grid;place-items:center;font-size:1.05rem;padding:0;cursor:pointer;flex:0 0 auto}
.ibtn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.simtag{background:var(--sim);color:#fff;border-radius:.3rem;font-size:.6rem;font-weight:850;padding:.1rem .3rem}
/* Puces d'alerte */
#chips{display:flex;gap:.25rem;overflow:hidden;flex:0 0 auto;white-space:nowrap;cursor:pointer}
.chip{border-radius:.4rem;padding:.16rem .42rem;font-size:.7rem;font-weight:750;background:var(--card);border:1px solid var(--line);flex:0 0 auto}
.chip.bad{background:var(--bad);color:#fff;border-color:transparent}
.chip.warn{background:var(--warn);color:#fff;border-color:transparent}
.chip.yel{background:var(--yel);color:#111;border-color:transparent}
.chip.info{background:var(--info);color:#fff;border-color:transparent}
.chip.ok{color:var(--ok)}
/* Tuiles */
#tiles{flex:1 1 0;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:var(--gap)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:.6rem;padding:.36rem .46rem;min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:.1rem;cursor:pointer}
.tile h3{margin:0;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:850;display:flex;align-items:center;justify-content:space-between;gap:.3rem;white-space:nowrap;min-width:0}
.tile h3>span:first-child{overflow:hidden;text-overflow:ellipsis}
.tb{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:.08rem;overflow:hidden}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:.3rem;font-size:.82rem;line-height:1.2;white-space:nowrap;min-width:0}
.r>span:first-child{color:var(--mute);overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.r>b,.r>span:last-child{flex:0 0 auto}
.r b{font-weight:780}
.big{font-size:2.55rem;font-weight:850;line-height:.92;letter-spacing:-.04em}
.wx{display:flex;align-items:center;gap:.45rem;min-width:0}
.wx2{display:flex;flex-direction:column;font-size:.78rem;line-height:1.2;min-width:0}
.wx2 b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{border-radius:.32rem;padding:.08rem .34rem;font-size:.62rem;font-weight:850;color:#fff;background:var(--s0);white-space:nowrap;letter-spacing:.02em;text-transform:none}
.badge.ok{background:var(--ok)}.badge.yel{background:var(--yel);color:#111}.badge.warn{background:var(--warn)}.badge.bad{background:var(--bad)}.badge.info{background:var(--info)}.badge.mutebg{background:var(--s0)}
.act{font-size:.76rem;font-weight:780;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it{font-size:.74rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it.p1{font-weight:780}
.sp{display:inline-block;border-radius:.3rem;padding:.04rem .36rem;font-weight:850;font-size:.74rem;color:#fff;background:var(--s0);white-space:nowrap}
.k0{background:var(--s0)}.k1{background:var(--s1)}.k2{background:var(--s2)}.k3{background:var(--s3)}.k4{background:var(--s4)}.kice{background:var(--ice)}.kn{background:var(--s0)}.k-1{background:var(--s0)}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-info{color:var(--info)}.c-yel{color:var(--yel)}
.gauge{position:relative;height:.62rem;border-radius:.35rem;display:flex;overflow:visible;margin:.15rem 0 .1rem}
.gauge>span{height:100%}
.gauge>span:first-child{border-radius:.35rem 0 0 .35rem}.gauge>span:nth-child(4){border-radius:0 .35rem .35rem 0}
.gauge>i{position:absolute;top:-.22rem;width:.3rem;height:1.06rem;margin-left:-.15rem;background:var(--ink);border-radius:.15rem;box-shadow:0 0 0 .1rem var(--card)}
.gl{display:flex;align-items:baseline;gap:.35rem;white-space:nowrap}
.gl .lv{font-size:1.18rem;font-weight:850}
.f{font-size:.74rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:.12rem;align-items:flex-end}
.mini>span{flex:1 1 0;border-radius:.2rem;font-size:.55rem;text-align:center;color:#fff;font-weight:800;line-height:1.35}
/* Bande horaire */
#hours{flex:0 0 auto;display:grid;grid-template-columns:repeat(var(--n,8),minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:.6rem;overflow:hidden;cursor:pointer}
.hc{display:flex;flex-direction:column;align-items:center;padding:.18rem 0 .16rem;font-size:.68rem;line-height:1.17;border-left:1px solid var(--line);min-width:0;white-space:nowrap}
.hc:first-child{border-left:0;background:var(--card2)}
.hc .t{font-weight:850}
.hc .e{font-size:.92rem;line-height:1.12}
.hc .T{font-weight:850;font-size:.84rem}
.hc .p{color:var(--info);font-weight:750}
.hc .w{color:var(--mute)}
.hc .g{border-radius:.25rem;color:#fff;font-weight:800;font-size:.6rem;width:92%;text-align:center;margin:.05rem 0;background:var(--s0)}
.hc .g.k1{background:var(--s1)}.hc .g.k2{background:var(--s2)}.hc .g.k3{background:var(--s3)}.hc .g.k4{background:var(--s4)}.hc .g.kice{background:var(--ice)}
/* Zones */
#zones{flex:0 0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.2rem}
.z{border-radius:.42rem;padding:.14rem .08rem;text-align:center;color:#fff;background:var(--s0);font-size:.62rem;line-height:1.15;cursor:pointer;min-width:0;overflow:hidden;white-space:nowrap;position:relative}
.z b{display:block;font-size:.7rem;font-weight:850;overflow:hidden;text-overflow:ellipsis}
.z.cl{opacity:.55;outline:1px dashed var(--mute);outline-offset:-2px}
.z em{position:absolute;top:0;right:0;font-style:normal;font-size:.5rem;background:rgba(0,0,0,.35);padding:0 .15rem;border-radius:0 0 0 .25rem}
.z.k1{background:var(--s1)}.z.k2{background:var(--s2)}.z.k3{background:var(--s3)}.z.k4{background:var(--s4)}
.z.leg{background:var(--card);color:var(--ink);border:1px solid var(--line)}
/* Pied */
footer{flex:0 0 auto;display:flex;gap:.25rem;align-items:stretch}
.fb{flex:1 1 0;border:1px solid var(--line);background:var(--card);border-radius:.5rem;padding:.32rem .1rem;font-size:.7rem;font-weight:780;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fb .n{background:var(--bad);color:#fff;border-radius:99px;padding:0 .3rem;margin-left:.15rem;font-size:.6rem}
.upd{font-size:.56rem;color:var(--mute);text-align:right;white-space:nowrap;line-height:1.2;align-self:center;flex:0 0 auto}
.upd.stale{color:var(--bad);font-weight:800}
/* Fenêtres */
#ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(3,10,20,.6);display:none;align-items:center;justify-content:center;
  padding:max(env(safe-area-inset-top),.5rem) .45rem max(env(safe-area-inset-bottom),.5rem);z-index:10}
#ov.on{display:flex}
.mo{background:var(--card);color:var(--ink);border-radius:.8rem;width:min(100%,38rem);max-height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.45rem .65rem;border-bottom:1px solid var(--line);font-weight:850;font-size:1rem}
.mh button{border:0;background:var(--card2);border-radius:.45rem;width:2rem;height:2rem;font-size:1rem;cursor:pointer;flex:0 0 auto}
.mb{padding:.5rem .65rem .6rem;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:.38rem;font-size:.84rem;line-height:1.3}
.mb h4{margin:.15rem 0 0;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.mb p{margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.12rem .8rem}
.g2 .r{font-size:.8rem}
.tbl{width:100%;border-collapse:collapse;font-size:.76rem}
.tbl td,.tbl th{padding:.12rem .2rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{color:var(--mute);font-size:.62rem;text-transform:uppercase;letter-spacing:.04em}
.tbl tr.hl td{background:var(--card2);font-weight:850}
.bars{display:flex;align-items:flex-end;gap:1px;height:4.2rem;border-bottom:1px solid var(--line);position:relative}
.bars>span{flex:1 1 0;background:var(--info);border-radius:.12rem .12rem 0 0;min-height:1px}
.bars>span.rn{background:var(--s2)}.bars>span.fz{background:var(--ice)}.bars>span.z0{background:transparent}
.bars>.now{position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
.bx{display:flex;justify-content:space-between;font-size:.6rem;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:.5rem;padding:.42rem .6rem;font-weight:780;cursor:pointer}
.btn.on{background:var(--acc);color:#fff;border-color:transparent}
.btn.pri{background:var(--acc);color:#fff;border-color:transparent}
.btn.dng{background:var(--bad);color:#fff;border-color:transparent}
.bg{display:flex;flex-wrap:wrap;gap:.3rem}
.inp{border:1px solid var(--line);background:var(--card2);border-radius:.45rem;padding:.38rem .5rem;width:100%;-webkit-user-select:text;user-select:text}
.lnk{color:var(--acc);font-weight:750;text-decoration:none}
.chrono{font-size:2.6rem;font-weight:850;text-align:center;letter-spacing:-.03em;line-height:1}
.bigbtn{width:100%;padding:.8rem;font-size:1.15rem;font-weight:850;border-radius:.7rem;border:0;color:#fff;background:var(--ok);cursor:pointer}
.bigbtn.stop{background:var(--bad)}
.rad{position:relative;overflow:hidden;border-radius:.6rem;background:#cfd8e2;width:100%}
.rad img{position:absolute;max-width:none;-webkit-user-drag:none}
.rad .ov{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.radbar{display:flex;gap:.3rem;align-items:center}
.radbar input{flex:1}
.sl{display:grid;grid-template-columns:7.5rem 1fr 3.2rem;align-items:center;gap:.4rem;font-size:.8rem}
.sl input{width:100%}
.alrt{border-left:.3rem solid var(--bad);background:var(--card2);padding:.35rem .5rem;border-radius:.35rem;white-space:pre-line}
.alrt.warn{border-color:var(--warn)}.alrt.yel{border-color:var(--yel)}.alrt.info{border-color:var(--info)}
/* Paysage et grands écrans */
@media (orientation:landscape) and (max-height:620px){
  html{font-size:calc(clamp(9px,min(1.5vw,2.7vh),18px)*var(--scale))}
  #tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  #zones{grid-template-columns:repeat(14,minmax(0,1fr))}
}
@media (min-width:900px) and (min-height:621px){
  html{font-size:calc(clamp(12px,min(1.45vw,2.05vh),22px)*var(--scale))}
  #tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  #zones{grid-template-columns:repeat(14,minmax(0,1fr))}
}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <div id="chips" data-act="alerts"></div>
  <main id="tiles">
    <section class="tile" id="t-sp" data-act="m-glide"></section>
    <section class="tile" id="t-gl" data-act="m-glide"></section>
    <section class="tile" id="t-pi" data-act="m-pistes"></section>
    <section class="tile" id="t-sn" data-act="m-snow"></section>
    <section class="tile" id="t-co" data-act="m-cold"></section>
    <section class="tile" id="t-dy" data-act="m-day"></section>
  </main>
  <div id="hours" data-act="m-hours"></div>
  <div id="zones"></div>
  <footer id="ftr"></footer>
</div>
<div id="ov"><div class="mo"><div class="mh"><span id="mt"></span><button data-act="close" aria-label="Fermer">✕</button></div><div class="mb" id="mb"></div></div></div>

<script>
'use strict';
/* =====================================================================
   GLISSADES DES PAYS D'EN HAUT — OUTIL D'INFO TERRAIN (employés)
   Un seul fichier, aucune dépendance. Sources (gratuites, sans clé) :
   - Site officiel (API WordPress) : état et vitesse de glisse par zone
   - Open-Meteo : météo horaire au point exact du Domaine
   - Environnement Canada (MSC GeoMet) : alertes, prévisions texte, radar
   ===================================================================== */
const CFG = {
  lat: 45.8847, lon: -74.1234, tz: 'America/Toronto',
  ecCity: 'qc-c3',                         // Saint-Sauveur (page-ville ECCC)
  bbox: '-74.20,45.85,-74.05,45.92',        // zone d'alertes autour de Piedmont
  site: 'https://domainedespaysdenhaut.com/wp-json/wp/v2/pages?slug=les-glissades&_fields=modified_gmt,content',
  siteWeb: 'https://domainedespaysdenhaut.com/les-glissades/',
  horaireWeb: 'https://domainedespaysdenhaut.com/les-glissades/planifier-votre-sortie-aux-glissades/horaire/',
  version: '1.0'
};

/* Zones de glisse (infos du site officiel). dv = écart de vitesse estimé selon le niveau (pente plus raide = plus rapide) */
const ZONES = [
  {id:'olympiade', nom:'Olympiade', c:'OLY',  v:'Tube', p:16, niv:'Bout de chou', rem:'Aucune', gl:'1 à 2', dv:-14, soir:true},
  {id:'champion',  nom:'Champion',  c:'CHA',  v:'Tube', p:8,  niv:'Bout de chou', rem:'Tapis roulant avec dôme', gl:'1 à 2', dv:-14, soir:true},
  {id:'podium',    nom:'Podium',    c:'POD',  v:'Tube', p:8,  niv:'Bout de chou', rem:'Tapis roulant avec dôme', gl:'1 à 2', dv:-14, soir:true},
  {id:'boomerang', nom:'Boomerang', c:'BOO',  v:'Tube', p:4,  niv:'Débutant', rem:'Tapis roulant avec dôme', gl:'1 à 3', dv:-8, soir:true},
  {id:'toboggan',  nom:'Toboggan',  c:'TOB',  v:'Tube', p:9,  niv:'Débutant à intermédiaire', rem:'Tapis avec dôme ou télésiège', gl:'1 à 6', dv:-4, soir:true},
  {id:'slalom',    nom:'Slalom',    c:'SLA',  v:'Tube', p:3,  niv:'Intermédiaire', rem:'Télésiège', gl:'2 à 3', dv:0, soir:true},
  {id:'avalanche', nom:'Avalanche', c:'AVA',  v:'Tube', p:3,  niv:'Expert', rem:'Tapis roulant avec dôme', gl:'2 à 6', taille:'1,32 m (52 po)', dv:7, soir:true},
  {id:'formule 1', nom:'Formule 1', c:'F1',   v:'Tube', p:3,  niv:'Expert', rem:'Télésiège', gl:'2 à 6', taille:'1,32 m (52 po)', dv:7, soir:true},
  {id:'yeti',      nom:'Parc du Yéti', c:'YÉTI', v:'Yéti', p:24, niv:'CPE, maternelle, 1re année', rem:'Tapis roulant', gl:'1 à 6', dv:-18, soir:false, note:'Groupes scolaires sur réservation'},
  {id:'rafting',   nom:'Rafting',   c:'RAFT', v:'Rafting + Tornade', p:3, niv:'Intermédiaire', rem:'Télérafting', gl:'4 à 12', dv:3, soir:true},
  {id:'tornade',   nom:'Tornade',   c:'TORN', v:'Rafting + Tornade', p:3, niv:'Expert', rem:'Télérafting', gl:'2 à 8', dv:7, soir:true},
  {id:'bobsleigh', nom:'Bobsleigh', c:'BOB',  v:'Bobsleigh + Vortex360', p:3, niv:'Intermédiaire', rem:'Tapis roulant', gl:'2 à 4', taille:'1,32 m (52 po)', casque:'Obligatoire (prêté)', dv:2, soir:false},
  {id:'vortex360', nom:'Vortex360', c:'VORT', v:'Bobsleigh + Vortex360', p:3, niv:'Expert', rem:'Tapis roulant', gl:'2 à 6', taille:'1,32 m (52 po)', casque:'Obligatoire (prêté)', dv:7, soir:false}
];

/* Horaire type d'une saison, calqué sur 2026-2027 et répété chaque année (dates MM-JJ).
   j = [dim, lun, mar, mer, jeu, ven, sam]; null = fermé. L'état ouvert/fermé du site officiel a priorité. */
const H1016 = [10,16], H0920 = [9,20], H0916 = [9,16], H0917 = [9,17];
const HORAIRE = [
  {du:'11-01', au:'12-13', j:[H1016,null,null,H1016,H1016,H1016,H1016], note:'Si ouvert (date d\'ouverture à confirmer)', tbc:true},
  {du:'12-14', au:'12-25', h:H1016},
  {du:'12-26', au:'12-30', h:H0920, note:'Temps des Fêtes'},
  {du:'12-31', au:'12-31', h:H0917, note:'Temps des Fêtes'},
  {du:'01-01', au:'01-01', h:H0917, note:'Temps des Fêtes'},
  {du:'01-02', au:'01-02', h:H0920, note:'Temps des Fêtes'},
  {du:'01-03', au:'01-03', h:H0916, note:'Temps des Fêtes'},
  {du:'01-04', au:'02-26', j:[H0916,H1016,H1016,H1016,H1016,H1016,H0920]},
  {du:'02-27', au:'03-06', h:H0920, note:'Semaine de relâche (dates approx.)'},
  {du:'03-07', au:'03-07', h:H0916, note:'Semaine de relâche (dates approx.)'},
  {du:'03-08', au:'03-21', h:H1016},
  {du:'03-22', au:'04-18', j:[H1016,null,null,null,null,H1016,H1016], note:'Rafting, Yéti et La Cabane seulement'}
];

/* ===================== Utilitaires ===================== */
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const SET = Object.assign({theme:'auto', refresh:10, scale:1}, LS.get('gpdh.set', {}));
const DEV = Object.assign({unlocked:false, sim:false, scen:'parfaite', T:null, ws:null, wg:null, snx:1, siteOpen:true, shift:0}, LS.get('gpdh.dev', {}));
const saveSet = () => LS.set('gpdh.set', SET);
const saveDev = () => LS.set('gpdh.dev', DEV);
const NOW = () => Date.now() + (DEV.unlocked ? (DEV.shift || 0) : 0);
const HOUR = 3600e3;
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* Zones + mesures du chrono */
  const log = LS.get('gpdh.log', []);
  const g0 = V.glide, g3 = V.glideH && V.glideH[3];
  V.zones = ZONES.map(z => {
    const live = site && site.d && site.d.zones[z.id], es = g0 ? adj(g0.s, z.dv) : null;
    const m = log.find(e => e.z === z.id && e.kmh && now - e.t < 3 * HOUR);
    return Object.assign({}, z, {live, es, est:es != null ? glv(es) : null, est3:g3 ? glv(adj(g3.s, z.dv)) : null,
      closed:!!(live && live.fr && live.fr.o === 0), meas:m ? Math.round(m.kmh) : null});
  });
  plan(V, H, now);
  /* Puces d'alerte */
  const ch = [];
  const al = D.al && D.al.d ? D.al.d.filter(a => !a.exp || a.exp > now) : [];
  V.alerts = al;
  for (const a of al) ch.push({cls:a.col === 'red' ? 'bad' : a.col === 'orange' ? 'warn' : a.col === 'yellow' ? 'yel' : a.type === 'warning' ? 'bad' : a.type === 'watch' ? 'warn' : 'yel', txt:'⚠ ' + a.nom});
  if (V.cur) {
    const c = V.cur, sn = V.snow || {};

    else if (sn.iceNow) ch.push({cls:'warn', txt:'🧊 Surfaces glacées'});
    if (sn.snowing) ch.push({cls:'info', txt:'❄ Neige en cours' + (c.sn >= 0.1 ? ' ' + cm(c.sn) + '/h' : '')});
    else if (sn.start && sn.start - now <= 6 * HOUR) ch.push({cls:'info', txt:'❄ Neige dès ' + hh(sn.start)});
    if (sn.rainNow && !sn.frzNow) ch.push({cls:'info', txt:'🌧 Pluie'});
    if (sn.refreeze) ch.push({cls:'warn', txt:'🧊 Regel ' + hh(sn.refreeze)});
    if (sn.poudNow) ch.push({cls:'warn', txt:'💨 Poudrerie'});
    if ((c.wg || 0) >= 50) ch.push({cls:c.wg >= 70 ? 'bad' : 'warn', txt:'💨 Rafales ' + n0(c.wg)});
    if (c.vis != null && c.vis < 1000) ch.push({cls:'warn', txt:'🌫 Visibilité ' + visTxt(c.vis)});
    if (c.feel != null && Math.round(c.feel) <= -28) ch.push({cls:Math.round(c.feel) <= -40 ? 'bad' : 'warn', txt:'🥶 Gelures ' + riskOf(c.feel).frost});
    if (V.glide && V.glide.ice) ch.push({cls:'warn', txt:'⚡ Glisse glacée'});
  }
  if (!ch.length) ch.push({cls:'ok', txt:V.cur ? '✓ Aucune alerte' : 'Chargement des données…'});
  V.chips = ch;
  return V;
}

/* ===================== Déductions pour la journée aux Glissades ===================== */
function plan(V, H, now) {
  const g = V.glide, sn = V.snow || {}, c = V.cur, co = V.cold || {}, dy = V.day || {}, sc = dy.s;
  const close = sc && sc.fm ? sc.fm : now + 8 * HOUR;
  const work = H.filter(x => x.T != null && x.t >= now - HOUR && x.t <= Math.max(close, now + 4 * HOUR));
  /* Tenue recommandée (pire ressenti jusqu'à la fermeture) */
  let wmin = co.wc != null ? co.wc : null;
  for (const x of work) { const v = windChill(x.T, x.ws); if (wmin == null || v < wmin) wmin = v; }
  const T = [];
  if (wmin != null) T.push(wmin > -5 ? 'Manteau d\'hiver, tuque, gants' : wmin > -15 ? '3 couches, tuque, gants doublés' : wmin > -25 ? '3 couches, cache-cou, mitaines, bottes chaudes' :
    wmin > -35 ? '3 couches, cagoule, mitaines, chaufferettes' : 'Peau entièrement couverte, chaufferettes, rotations courtes');
  if (work.some(x => (x.rain || 0) >= 0.2 || FRZ.includes(x.wc))) T.push('imperméable, gants de rechange');
  if (sn.snowing || work.some(x => (x.sn || 0) >= 0.3)) T.push('lunettes de ski');
  if (work.some(x => (x.ws || 0) >= 30)) T.push('coupe-vent');
  if ((co.uvmax || 0) >= 3 || work.some(x => x.day && x.cc != null && x.cc < 40)) T.push('lunettes de soleil, écran solaire');
  V.tenue = {wmin, list:T, short:T.join(' · ')};
  /* Achalandage prévu (type de journée + météo pendant les heures d'ouverture) */
  V.crowd = null;
  if (sc && sc.o != null) {
    const p = lp(now), note = sc.note || '';
    let b, why;
    if (/Fêtes/.test(note)) { b = 85; why = 'Temps des Fêtes'; }
    else if (/relâche/.test(note)) { b = 90; why = 'Semaine de relâche'; }
    else if (p.wd === 6) { b = 75; why = 'Samedi'; }
    else if (p.wd === 0) { b = 65; why = 'Dimanche'; }
    else if (p.mo === 12 && p.d >= 20) { b = 50; why = 'Vacances scolaires'; }
    else { b = 25; why = 'Jour de semaine (groupes scolaires possibles)'; }
    if (sc.tbc) { b -= 10; why += ', début de saison'; }
    const oh = H.filter(x => x.T != null && x.t >= sc.om && x.t < sc.fm), A = [];
    if (oh.length) {
      const feel = oh.reduce((a, x) => a + windChill(x.T, x.ws), 0) / oh.length, Tm = oh.reduce((a, x) => a + x.T, 0) / oh.length;
      const sun = oh.filter(x => x.cc != null && x.cc < 50).length / oh.length, snow = sumK(oh, 'sn') || 0;
      if (oh.some(x => FRZ.includes(x.wc))) A.push(['verglas', -35]);
      else if (oh.some(x => (x.rain || 0) >= 0.3 && x.T > 0)) A.push(['pluie', -30]);
      if (feel <= -25) A.push(['grand froid', -25]); else if (feel <= -18) A.push(['froid', -12]);
      if (snow >= 8) A.push(['tempête, routes', -12]);
      if (Tm > 6) A.push(['neige molle', -10]);
      if (!A.length && feel > -15 && Tm < 3 && sun >= 0.5) A.push(['beau temps', 8]);
    }
    const s = clamp(b + A.reduce((a, x) => a + x[1], 0), 0, 100);
    V.crowd = Object.assign(s < 30 ? {n:'Faible', cls:'ok'} : s < 55 ? {n:'Modéré', cls:'yel'} : s < 78 ? {n:'Élevé', cls:'warn'} : {n:'Très élevé', cls:'bad'},
      {s, why:why + (A.length ? ' · ' + A.map(x => x[0]).join(', ') : ''), peak:'11 h – 14 h' + (sc.f >= 20 ? ' et 18 h – 20 h' : '')});
  }
  /* Pistes et équipements : quoi faire, par priorité */
  const P = [], add = (pr, ico, txt) => P.push({p:pr, ico, txt});
  const later = (V.glDay || []).filter(x => x.t > now);
  if (g) {
    if (g.ice) add(1, '🧊', 'Pistes glacées : renforcer les zones de freinage, réduire les glisseurs');
    else if (g.lv.k === 4) add(1, '⚡', 'Glisse très rapide : vérifier les fins de piste et zones de freinage');
    else { const f = later.find(x => x.lv.k === 4 || x.ice); if (f) add(2, '⚡', 'Très rapide dès ' + hh(f.t) + ' : prévoir freinage et moins de glisseurs'); }
  }
  if ((sn.rate || 0) >= 0.3) add(1, '❄️', 'Neige ' + cm(sn.rate) + '/h : dégager couloirs et sorties de tapis ' + (sn.rate >= 1.5 ? 'aux 30 min' : sn.rate >= 0.7 ? 'chaque heure' : 'aux 2 h'));
  else if (sn.start && sn.start < close) add(2, '❄️', 'Neige dès ' + hh(sn.start) + ' : la glisse va ralentir, prévoir le dégagement des couloirs');
  if ((sn.p6 || 0) >= 2) add(1, '🚜', 'Neige fraîche ' + cm(sn.p6) + ' : compacter les couloirs avant l\'achalandage');
  else if ((sn.p24 || 0) >= 3) add(2, '🚜', cm(sn.p24) + ' tombés en 24 h : rafraîchir les couloirs lents');
  const gx = Math.max(c && c.wg || 0, maxK(work.filter(x => x.t <= close), 'wg') || 0);
  if (gx >= 60) add(1, '💨', 'Rafales ' + n0(gx) + ' km/h : surveiller le télérafting, attacher tubes et objets légers');
  if (c && (c.ws || 0) >= 35 && ((sn.p24 || 0) >= 1 || sn.snowing)) add(2, '💨', 'Neige soufflée : vérifier couloirs, bermes et quais');
  if (sn.frzNow || sn.frzPast || sn.frzNext) add(1, '🧊', 'Verglas : vérifier la glace sur les tapis roulants et les quais');
  if (sn.rainNow) add(2, '🌧️', 'Pluie : neige lourde, glisse lente' + (sn.refreeze ? '; regel vers ' + hh(sn.refreeze) + ' = glace' : ''));
  else if (sn.refreeze) add(2, '🧊', 'Regel vers ' + hh(sn.refreeze) + ' : pistes glacées en soirée et demain matin');
  if (!sn.rainNow && work.some(x => x.t > now && x.t < close && x.T > 1 && (x.sw || 0) > 300)) add(3, '☀️', 'Neige molle en après-midi : surveiller ornières et bosses');
  if (g && g.lv.k === 1 && !g.ice && !((sn.p6 || 0) >= 2) && !later.some(x => x.lv.k >= 3)) add(3, '🐢', 'Glisse lente : le haut de la plage de glisseurs est correct');
  if (c && c.feel != null && c.feel <= -30) add(2, '🥶', 'Grand froid : rotations courtes aux remontées et aux départs');
  if (dy.light && /Éclairage/.test(dy.light.lbl)) add(3, '💡', 'Allumer l\'éclairage des pistes vers ' + dy.light.v);
  if (dy.tw != null && dy.tw <= -4) add(3, '🌨️', 'Fabrication de neige possible ' + (dy.win === '> 24 h' ? 'toute la journée' : 'maintenant (' + dy.win + ')'));
  else if (dy.win && /→|dès/.test(dy.win)) add(3, '🌨️', 'Fenêtre de fabrication de neige : ' + dy.win);
  if (!P.length && c) add(3, '✓', 'Conditions stables : entretien régulier des couloirs');
  P.sort((a, b) => a.p - b.p); V.pistes = P;
}

  openModal('Radar · précipitations', '<div class="rad" id="rad"></div><div class="radbar"><button class="btn" data-act="rz" data-v="-1">−</button><button class="btn" data-act="rplay" id="rplay">❚❚</button>' +
    '<input type="range" id="rT" min="0" max="0" value="0"><span id="rL" style="font-weight:850;min-width:3.2rem;text-align:right">—</span><button class="btn" data-act="rz" data-v="1">+</button></div>' +
    '<div class="bg"><button class="btn' + (RD.layer === 'RADAR_1KM_RSNO' ? ' on' : '') + '" data-act="rlayer" data-v="RADAR_1KM_RSNO">❄ Neige</button><button class="btn' + (RD.layer === 'RADAR_1KM_RRAI' ? ' on' : '') + '" data-act="rlayer" data-v="RADAR_1KM_RRAI">🌧 Pluie</button></div>' +
    '<p class="mute" style="font-size:.64rem">Cercles : 25 et 50 km autour du Domaine (📍). Dernière heure, images aux 6 min. Radar © ECCC GeoMet · fond de carte © Esri, © OpenStreetMap.</p>');
  drawRadar();
}
async function drawRadar() {
  stopRadar();
  const box = $('#rad'); if (!box) return;
  const W = box.clientWidth, Hh = Math.round(Math.min(W, innerHeight * 0.56)); box.style.height = Hh + 'px';
  const z = RD.z, [px, py] = mercPx(CFG.lat, CFG.lon, z), x0 = px - W / 2, y0 = py - Hh / 2, n = Math.pow(2, z);
  let h = '';
  for (let tx = Math.floor(x0 / 256); tx <= Math.floor((x0 + W) / 256); tx++) for (let ty = Math.floor(y0 / 256); ty <= Math.floor((y0 + Hh) / 256); ty++) {
    if (ty < 0 || ty >= n) continue; const sx = ((tx % n) + n) % n;
    h += '<img alt="" src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/' + z + '/' + ty + '/' + sx + '" ' +
      'onerror="this.onerror=null;this.src=\'https://tile.openstreetmap.org/' + z + '/' + sx + '/' + ty + '.png\'" style="left:' + Math.round(tx * 256 - x0) + 'px;top:' + Math.round(ty * 256 - y0) + 'px;width:256px;height:256px">';
  }
  const R0 = 6378137, S = 2 * Math.PI * R0, m = v => v / (256 * n) * S;
  const bb = [m(x0) - S / 2, S / 2 - m(y0 + Hh), m(x0 + W) - S / 2, S / 2 - m(y0)].map(v => v.toFixed(0)).join(',');
  const res = S * Math.cos(CFG.lat * Math.PI / 180) / (256 * n), r25 = 25000 / res, r50 = 50000 / res;
  h += '<div id="radL" class="ov"></div><svg class="ov" width="' + W + '" height="' + Hh + '"><g fill="none" stroke="#d02c24" stroke-width="1.5" stroke-dasharray="4 4" opacity=".75"><circle cx="' + W / 2 + '" cy="' + Hh / 2 + '" r="' + r25 + '"/><circle cx="' + W / 2 + '" cy="' + Hh / 2 + '" r="' + r50 + '"/></g>' +
    '<text x="' + (W / 2 + 4) + '" y="' + (Hh / 2 - r25 + 12) + '" font-size="10" fill="#d02c24">25 km</text><text x="' + (W / 2 + 4) + '" y="' + (Hh / 2 - r50 + 12) + '" font-size="10" fill="#d02c24">50 km</text></svg>' +
    '<div class="ov" style="display:grid;place-items:center;font-size:1.3rem;margin-top:-1.2rem">📍</div>';
  box.innerHTML = h;
  let frames = [];
  try {
    const xml = await fetch('https://geo.weather.gc.ca/geomet?service=WMS&version=1.3.0&request=GetCapabilities&layer=' + RD.layer, {cache:'no-store'}).then(r => r.text());
    const dm = /<Dimension[^>]*name="time"[^>]*>([^<]+)<\/Dimension>/i.exec(xml);
    if (dm) { const [a, b] = dm[1].trim().split('/'), end = Date.parse(b), st = Date.parse(a); for (let k = 9; k >= 0; k--) { const t = end - k * 6 * 60000; if (t >= st) frames.push(t); } }
  } catch (e) {}
  if (!$('#rad')) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), base = 'https://geo.weather.gc.ca/geomet?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&FORMAT=image/png&TRANSPARENT=TRUE&STYLES=&CRS=EPSG:3857&LAYERS=' + RD.layer +
    '&WIDTH=' + Math.round(W * dpr) + '&HEIGHT=' + Math.round(Hh * dpr) + '&BBOX=' + bb;
  if (!frames.length) frames = [null];
  RD.frames = frames; RD.i = frames.length - 1;
  const L = $('#radL');
  L.innerHTML = frames.map((t, i) => '<img alt="" src="' + base + (t ? '&TIME=' + new Date(t).toISOString().replace('.000', '') : '') + '" style="left:0;top:0;width:' + W + 'px;height:' + Hh + 'px;opacity:.85;display:' + (i === RD.i ? 'block' : 'none') + '">').join('');
  RD.imgs = [...L.querySelectorAll('img')];
  const sl = $('#rT'); sl.max = frames.length - 1; sl.value = RD.i;
  sl.oninput = () => { stopRadar(); $('#rplay').textContent = '▶'; showFrame(+sl.value); };
  showFrame(RD.i);
  if (frames.length > 1) playRadar();
}
function showFrame(i) {
  RD.i = i; RD.imgs.forEach((im, j) => im.style.display = j === i ? 'block' : 'none');
  const t = RD.frames[i], l = $('#rL'), s = $('#rT'); if (l) l.textContent = t ? hm(t) : 'récent'; if (s) s.value = i;
}
function playRadar() {
  stopRadar(); let hold = 0; const b = $('#rplay'); if (b) b.textContent = '❚❚';
  RD.timer = setInterval(() => { if (!$('#rad')) return stopRadar(); if (RD.i === RD.frames.length - 1 && hold++ < 3) return; hold = 0; showFrame((RD.i + 1) % RD.frames.length); }, 450);
}

/* ===================== Réglages et DEV ===================== */
function mSettings() {
  const b = (act, v, cur, lbl) => '<button class="btn' + (cur ? ' on' : '') + '" data-act="' + act + '" data-v="' + v + '">' + lbl + '</button>';
  let h = '<h4>Thème</h4><div class="bg">' + b('theme', 'auto', SET.theme === 'auto', 'Auto (soleil)') + b('theme', 'light', SET.theme === 'light', 'Clair') + b('theme', 'dark', SET.theme === 'dark', 'Sombre') + '</div>' +
    '<h4>Taille du texte</h4><div class="bg">' + b('scale', '-', false, 'A−') + '<span style="align-self:center;font-weight:850;min-width:3rem;text-align:center">' + Math.round(SET.scale * 100) + ' %</span>' + b('scale', '+', false, 'A+') + b('scale', '1', false, 'Défaut') + '</div>' +
    '<h4>Actualisation automatique</h4><div class="bg">' + [5, 10, 15, 30].map(m => b('refint', m, SET.refresh === m, m + ' min')).join('') + '</div>' +
    '<h4>Liens</h4><p><a class="lnk" href="' + CFG.siteWeb + '" target="_blank" rel="noopener">Site officiel ↗</a> · <a class="lnk" href="' + CFG.horaireWeb + '" target="_blank" rel="noopener">Horaire ↗</a> · ' +
    '<a class="lnk" href="https://meteo.gc.ca/fr/location/index.html?coords=45.885,-74.123" target="_blank" rel="noopener">Météo Canada ↗</a> · <a class="lnk" href="https://www.quebec511.info/" target="_blank" rel="noopener">Québec 511 ↗</a></p>' +
    '<h4>Données</h4><div class="bg"><button class="btn" data-act="clearCache">Vider le cache</button><button class="btn" data-act="chClear">Effacer journal chrono</button></div>' +
    '<h4>Développeur</h4><div class="bg"><button class="btn dng" data-act="dev">DEV</button></div>' +
    '<p class="mute" style="font-size:.66rem">Version ' + CFG.version + ' · Sources : site du Domaine des Pays d\'en Haut, Open-Meteo, Environnement et Changement climatique Canada. Outil indicatif : les consignes du superviseur ont priorité.</p>';
  openModal('Réglages', h);
}
function mDevCode() {
  openModal('Code développeur', '<p>Entrer le code pour activer le mode DEV (simulation de conditions, voyage dans le temps, diagnostic).</p>' +
    '<input id="devCode" class="inp" type="text" autocapitalize="characters" autocomplete="off" placeholder="Code">' +
    '<div class="bg"><button class="btn pri" data-act="devOk">Valider</button><button class="btn" data-act="settings">Retour</button></div><p id="devMsg" class="c-bad"></p>');
  setTimeout(() => { const i = $('#devCode'); if (i) i.focus(); }, 50);
}
function mDev() {
  const sc = SCEN[DEV.scen] || SCEN.parfaite, T = DEV.T != null ? DEV.T : sc.T, ws = DEV.ws != null ? DEV.ws : sc.ws, wg = DEV.wg != null ? DEV.wg : sc.wg;
  const sl = (id, lbl, min, max, step, v, unit) => '<div class="sl"><span>' + lbl + '</span><input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + v + '"><b id="' + id + 'V">' + v + unit + '</b></div>';
  const st = k => D.err[k] ? '<b class="c-bad">erreur</b> <span class="mute">' + esc(D.err[k]).slice(0, 60) + '</span>' : D[k] ? '<b class="c-ok">OK</b> <span class="mute">' + hm(D[k].t) + '</span>' : '<span class="mute">—</span>';
  const shiftTxt = DEV.shift ? (DEV.shift > 0 ? '+' : '\u2212') + dur(Math.abs(DEV.shift)) : 'aucun';
  let h = '<div class="bg"><button class="btn' + (DEV.sim ? ' on' : '') + '" data-act="devSim">Simulation : ' + (DEV.sim ? 'ACTIVE' : 'inactive') + '</button>' +
    '<button class="btn' + (DEV.siteOpen ? ' on' : '') + '" data-act="devSite">Site simulé : ' + (DEV.siteOpen ? 'ouvert' : 'fermé') + '</button></div>' +
    '<h4>Scénarios</h4><div class="bg">' + Object.keys(SCEN).map(k => '<button class="btn' + (DEV.scen === k ? ' on' : '') + '" data-act="devScen" data-v="' + k + '">' + SCEN[k].nom + '</button>').join('') + '</div>' +
    '<h4>Réglages fins</h4>' + sl('dvT', 'Température', -45, 15, 1, Math.round(T), '°') + sl('dvW', 'Vent', 0, 90, 1, ws, '') + sl('dvG', 'Rafales', 0, 120, 1, wg, '') + sl('dvS', 'Neige ×', 0, 4, 0.5, DEV.snx, '') +
    '<h4>Voyage dans le temps (décalage : ' + shiftTxt + ')</h4><div class="bg">' + [['-24', '−24 h'], ['-1', '−1 h'], ['1', '+1 h'], ['24', '+24 h'], ['168', '+7 j']].map(([v, l]) => '<button class="btn" data-act="devShift" data-v="' + v + '">' + l + '</button>').join('') +
    '<button class="btn" data-act="devJan">Samedi 16 janv. 14 h</button><button class="btn" data-act="devShift" data-v="0">Maintenant</button></div>' +
    '<h4>Diagnostic des sources</h4>' + R('Open-Meteo', st('om')) + R('ECCC page-ville', st('ec')) + R('ECCC alertes', st('al')) + R('Site officiel', st('site')) +
    '<div class="bg"><button class="btn" data-act="refresh">Recharger tout</button><button class="btn" data-act="devLock">Verrouiller DEV</button></div>';
  openModal('DEV · mode test', h);
  const bind = (id, key, unit) => { const el = $('#' + id); if (!el) return; el.oninput = () => { DEV[key] = +el.value; $('#' + id + 'V').textContent = el.value + unit; saveDev(); if (DEV.sim) render(); }; };
  bind('dvT', 'T', '°'); bind('dvW', 'ws', ''); bind('dvG', 'wg', ''); bind('dvS', 'snx', '');
}

/* ===================== Événements ===================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === 'close' || (el.id === 'ov' && e.target === el)) return closeModal();
  switch (a) {
    case 'refresh': fetchAll(); break;
    case 'settings': mSettings(); break;
    case 'm-wx': mWx(); break;
    case 'm-glide': mGlide(); break;
    case 'm-snow': mSnow(); break;
    case 'm-cold': mCold(); break;
    case 'm-day': mDay(); break;
    case 'm-hours': mHours(); break;
    case 'm-pistes': mPistes(); break;
    case 'alerts': mAlerts(); break;
    case 'zone': e.stopPropagation(); mZone(el.dataset.id); break;
    case 'radar': openRadar(); break;
    case 'rz': RD.z = clamp(RD.z + (+v), 6, 11); drawRadar(); break;
    case 'rplay': if (RD.timer) { stopRadar(); el.textContent = '▶'; } else playRadar(); break;
    case 'rlayer': RD.layer = v; openRadar(); break;
    case 'chrono': openChrono(el.dataset.id); break;
    case 'chGo':
      chSyncInputs();
      if (!CH.run) { CH.run = true; CH.t0 = performance.now(); CH.el = 0; openChrono(); chTick(); }
      else { CH.run = false; cancelAnimationFrame(CH.raf); CH.el = performance.now() - CH.t0; openChrono(); }
      break;
    case 'chReset': CH.run = false; cancelAnimationFrame(CH.raf); CH.el = 0; chSyncInputs(); openChrono(); break;
    case 'chSave': {
      chSyncInputs(); const dist = LS.get('gpdh.dist', {})[CH.zone], r = num(($('#chR') || {}).value), s = CH.el / 1000;
      let kmh = r || (dist && s > 0 ? dist / s * 3.6 : null);
      if (kmh && kmh > 150) kmh = null;
      if (!kmh && !(s > 0)) break;
      const log = LS.get('gpdh.log', []); log.unshift({t:NOW(), z:CH.zone, s:s > 0 && !r ? s : null, kmh}); LS.set('gpdh.log', log.slice(0, 60));
      CH.el = 0; openChrono(); render(); break;
    }
    case 'chClear': LS.set('gpdh.log', []); render(); if ($('#chT')) openChrono(); else mSettings(); break;
    case 'theme': SET.theme = v; saveSet(); render(); mSettings(); break;
    case 'scale': SET.scale = v === '1' ? 1 : clamp(Math.round((SET.scale + (v === '+' ? 0.05 : -0.05)) * 100) / 100, 0.75, 1.3); saveSet(); render(); mSettings(); break;
    case 'refint': SET.refresh = +v; saveSet(); schedule(); mSettings(); break;
    case 'clearCache': ['gpdh.c.om', 'gpdh.c.ec', 'gpdh.c.al', 'gpdh.c.site'].forEach(LS.del); D.om = D.ec = D.al = D.site = null; render(); fetchAll(); mSettings(); break;
    case 'dev': if (DEV.unlocked) mDev(); else mDevCode(); break;
    case 'devOk': {
      const c = (($('#devCode') || {}).value || '').trim().toUpperCase();
      if (c === 'BURGER') { DEV.unlocked = true; saveDev(); mDev(); } else { const m = $('#devMsg'); if (m) m.textContent = 'Code invalide.'; }
      break;
    }
    case 'devSim': DEV.sim = !DEV.sim; saveDev(); render(); mDev(); break;
    case 'devSite': DEV.siteOpen = !DEV.siteOpen; saveDev(); render(); mDev(); break;
    case 'devScen': DEV.scen = v; DEV.T = DEV.ws = DEV.wg = null; DEV.snx = 1; DEV.sim = true; saveDev(); render(); mDev(); break;
    case 'devShift': DEV.shift = v === '0' ? 0 : (DEV.shift || 0) + (+v) * HOUR; saveDev(); render(); mDev(); break;
    case 'devJan': DEV.shift = localMs(2027, 1, 16, 14, 0) - Date.now(); DEV.sim = true; saveDev(); render(); mDev(); break;
    case 'devLock': DEV.unlocked = false; DEV.sim = false; DEV.shift = 0; saveDev(); render(); closeModal(); break;
  }
});
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); if (e.key === 'Enter' && $('#devCode')) $('[data-act="devOk"]').click(); });
document.addEventListener('change', e => { if (e.target.id === 'chZ') { CH.zone = e.target.value; openChrono(); } if (e.target.id === 'chD') chSyncInputs(); });

/* ===================== Démarrage ===================== */
let refreshTimer = 0;
function schedule() { clearInterval(refreshTimer); refreshTimer = setInterval(() => fetchAll(), SET.refresh * 60000); }
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => { renderHours(); if ($('#rad')) drawRadar(); }, 150); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - D.last > 3 * 60000) fetchAll(); });
setInterval(() => { if (!document.hidden) render(); }, 30000);
render();
fetchAll();
schedule();
</script>
