<!DOCTYPE html>
<html lang="fr-CA" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glissades">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1726">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<title>Glissades PDH · Info terrain</title>
<style>
:root{
  --bg1:#eef2f8;--bg2:#d9e3f1;--card:rgba(255,255,255,.86);--solid:#fff;--card2:#eef2f7;--ink:#0b1220;--mute:#5b6678;--line:rgba(15,23,42,.08);--acc:#2563eb;
  --s0:#94a3b8;--s1:#2563eb;--s2:#059669;--s3:#ea580c;--s4:#dc2626;--ice:#7c3aed;
  --ok:#059669;--yel:#ca8a04;--warn:#ea580c;--bad:#dc2626;--info:#2563eb;--sim:#7c3aed;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.08);
  --r:1.15rem;--gap:.5rem;--scale:1;
}
[data-theme=dark]{
  --bg1:#05080f;--bg2:#0d1830;--card:rgba(255,255,255,.065);--solid:#101a2c;--card2:rgba(255,255,255,.09);--ink:#f1f5fb;--mute:#9aa8bd;--line:rgba(255,255,255,.09);--acc:#60a5fa;
  --s0:#64748b;--s1:#3b82f6;--s2:#10b981;--s3:#f97316;--s4:#ef4444;--ice:#a78bfa;
  --ok:#34d399;--yel:#facc15;--warn:#fb923c;--bad:#f87171;--info:#60a5fa;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{font-size:calc(clamp(13px,min(3.75vw,1.95vh),19px)*var(--scale));-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:var(--bg1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
body{background:radial-gradient(130% 70% at 0% 0%,var(--bg2),var(--bg1) 65%);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;gap:var(--gap);
  padding:max(env(safe-area-inset-top),.7rem) max(env(safe-area-inset-right),.85rem) max(env(safe-area-inset-bottom),.6rem) max(env(safe-area-inset-left),.85rem)}
.mute{color:var(--mute)}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-info{color:var(--info)}.c-yel{color:var(--yel)}
.k0,.kn,.k-1{background:var(--s0)}.k1{background:var(--s1)}.k2{background:var(--s2)}.k3{background:var(--s3)}.k4{background:var(--s4)}.kice{background:var(--ice)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  padding:.65rem .8rem;min-height:0;min-width:0;overflow:hidden;cursor:pointer}
.cap{font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;justify-content:space-between;gap:.5rem;white-space:nowrap}
.badge{border-radius:99px;padding:.16rem .5rem;font-size:.72rem;font-weight:750;color:#fff;background:var(--s0);letter-spacing:.03em;text-transform:none;white-space:nowrap}
.badge.ok{background:var(--ok)}.badge.yel{background:var(--yel);color:#111}.badge.warn{background:var(--warn)}.badge.bad{background:var(--bad)}.badge.info{background:var(--info)}.badge.mutebg{background:var(--s0)}
/* En-tête */
header{display:flex;align-items:center;gap:.6rem;flex:0 0 auto;min-height:2.9rem}
.hdl{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.hdl small{font-size:.74rem;font-weight:700;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;white-space:nowrap}
.simtag{background:var(--sim);color:#fff;border-radius:.3rem;padding:0 .3rem}
.clock{font-size:1.8rem;font-weight:800;letter-spacing:-.045em}
.hr{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:.25rem;min-width:0}
.pill{border-radius:99px;padding:.34rem .75rem;font-size:.8rem;font-weight:750;color:#fff;background:var(--s0);white-space:nowrap;max-width:52vw;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.upd{display:flex;align-items:center;gap:.25rem;border:0;background:none;padding:0;line-height:1.1;font-size:.74rem;font-weight:650;color:var(--mute);cursor:pointer}
.upd svg{width:.85rem;height:.85rem}
.upd.stale{color:var(--bad)}
.upd.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ib{width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:0 0 auto;cursor:pointer;padding:0}
.ib svg{width:1.25rem;height:1.25rem}
/* Pastilles */
#chips{display:flex;gap:.4rem;overflow-x:auto;overflow-y:hidden;flex:0 0 auto;cursor:pointer;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
#chips::-webkit-scrollbar{display:none}
#chips:empty{display:none}
.chip{flex:0 0 auto;border-radius:99px;padding:.3rem .7rem;font-size:.84rem;font-weight:650;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.chip.bad{background:var(--bad);color:#fff;border-color:transparent}.chip.warn{background:var(--warn);color:#fff;border-color:transparent}
.chip.yel{background:var(--yel);color:#111;border-color:transparent}.chip.info{background:var(--info);color:#fff;border-color:transparent}
/* Carte glisse */
.hero{padding:0;display:flex;flex-direction:column;flex:0 0 auto;border:0}
.hero-top{padding:.65rem .85rem .6rem;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2))}
.hero.l0{--g1:#64748b;--g2:#334155}.hero.l1{--g1:#3b82f6;--g2:#1e40af}.hero.l2{--g1:#10b981;--g2:#047857}
.hero.l3{--g1:#fb923c;--g2:#c2410c}.hero.l4{--g1:#f87171;--g2:#b91c1c}.hero.lice{--g1:#a78bfa;--g2:#6d28d9}
.hero-top .cap{color:rgba(255,255,255,.88)}
.tag{background:rgba(255,255,255,.22);border-radius:99px;padding:.16rem .5rem;font-size:.64rem;letter-spacing:.05em}
.hero-main{display:flex;align-items:baseline;gap:.6rem;margin-top:.15rem;min-width:0}
.hero-lv{font-size:2.05rem;font-weight:800;letter-spacing:-.045em;line-height:1;white-space:nowrap}
.hero-trend{font-size:.95rem;font-weight:650;opacity:.95;white-space:nowrap}
.hero-sub{font-size:.88rem;font-weight:550;opacity:.95;margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-bot{padding:.55rem .85rem .6rem;display:flex;flex-direction:column;gap:.55rem;background:var(--card)}
.sects{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem}
.sect{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.sect span{font-size:.76rem;color:var(--mute);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvp{border-radius:.6rem;padding:.26rem .1rem;text-align:center;font-size:.82rem;font-weight:750;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{display:grid;grid-template-columns:repeat(var(--n,8),minmax(0,1fr));gap:2px;cursor:pointer}
.hc{display:flex;flex-direction:column;align-items:center;gap:.1rem;line-height:1.15;min-width:0;white-space:nowrap}
.hc b{font-size:.74rem;color:var(--mute);font-weight:700}
.hc .e{font-size:.95rem;line-height:1.1}
.hc i{width:88%;height:.42rem;border-radius:99px;margin:.1rem 0}
.hc .T{font-weight:750;font-size:.86rem}
.hc .p{color:var(--info);font-weight:700;font-size:.72rem}
.hc .p.rn{color:var(--s2)}.hc .p.no{color:var(--mute)}
/* Zones */
#zones{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3rem;padding:.4rem;flex:0 0 auto;cursor:default}
.zc{border-radius:.65rem;padding:.28rem .05rem;text-align:center;color:#fff;min-width:0;cursor:pointer}
.zc.k1{background:var(--s1)}.zc.k2{background:var(--s2)}.zc.k3{background:var(--s3)}.zc.k4{background:var(--s4)}
.zc b{display:block;font-size:.84rem;font-weight:800;letter-spacing:.01em}
.zc span{display:block;font-size:.74rem;font-weight:650;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zc.cl{opacity:.5}
.zc.leg{background:var(--card2);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);min-height:0}
#mid{flex:1 1 0;grid-template-columns:1.2fr 1fr}
/* À noter */
#notes{display:flex;flex-direction:column;gap:.45rem}
.cnt{background:var(--card2);color:var(--ink);border-radius:99px;padding:.1rem .5rem;letter-spacing:0}
.nl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem;overflow:hidden;min-height:0;flex:1 1 auto}
.nl li{display:flex;gap:.45rem;align-items:flex-start;font-size:.86rem;line-height:1.25;font-weight:560}
.nl li i{flex:0 0 auto;width:.5rem;height:.5rem;border-radius:50%;margin-top:.34rem;background:var(--s0)}
.nl li.p1 i{background:var(--bad);box-shadow:0 0 0 .2rem rgba(220,38,38,.18)}
.nl li.p2 i{background:var(--warn)}
.nl li span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* Ressenti et journée */
#duo{flex:0 0 auto}
.stat{display:flex;flex-direction:column;gap:.1rem}
.kv{display:flex;justify-content:space-between;gap:.4rem;font-size:.82rem;line-height:1.38;white-space:nowrap;min-width:0}
.kv span{color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.kv b{font-weight:750;flex:0 0 auto}
.stat .kvs{display:flex;flex-direction:column;justify-content:space-evenly;flex:1 1 auto;min-height:0}
.stat .v{font-size:1.85rem;font-weight:800;letter-spacing:-.045em;line-height:1.08;margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v.sm{font-size:1.35rem;line-height:1.3}
.stat .l{font-size:.86rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:.8rem;color:var(--mute);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s.c-warn{color:var(--warn)}
/* Barre du bas */
#ftr{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:1.4rem;padding:.3rem;
  box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.nb{display:flex;flex-direction:column;align-items:center;gap:.12rem;padding:.34rem 0 .3rem;border:0;background:transparent;border-radius:1.1rem;font-size:.76rem;font-weight:650;cursor:pointer;position:relative}
.nb svg{width:1.3rem;height:1.3rem}
.nb:active{background:var(--card2)}
.nb .n{position:absolute;top:.2rem;left:56%;font-style:normal;background:var(--bad);color:#fff;border-radius:99px;font-size:.62rem;padding:0 .32rem;line-height:1.35}
/* Panneaux de détail */
#ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(2,6,15,.45);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;z-index:10}
#ov.on{display:flex}
.mo{background:var(--solid);color:var(--ink);width:min(100%,40rem);max-height:92%;border-radius:1.5rem 1.5rem 0 0;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -12px 40px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:1.15rem 1.1rem .45rem;font-size:1.2rem;font-weight:800;letter-spacing:-.02em;position:relative}
.mh::before{content:'';position:absolute;top:.45rem;left:50%;width:2.4rem;height:.28rem;margin-left:-1.2rem;border-radius:99px;background:var(--mute);opacity:.35}
.mh button{border:0;background:var(--card2);border-radius:50%;width:2.2rem;height:2.2rem;font-size:.95rem;cursor:pointer;flex:0 0 auto}
.mb{padding:.3rem 1.1rem 1.2rem;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:.55rem;font-size:.95rem;line-height:1.4}
.mb h4{margin:.5rem 0 0;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.mb p{margin:0}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;font-size:.92rem;line-height:1.35;min-width:0}
.r>span:first-child{color:var(--mute);min-width:0}
.r>b{flex:0 0 auto;font-weight:700;text-align:right}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.3rem 1rem}
.g2 .r{font-size:.86rem}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.tbl td,.tbl th{padding:.32rem .25rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{color:var(--mute);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
.tbl tr.hl td{background:var(--card2);font-weight:750}
.sp{display:inline-block;border-radius:.5rem;padding:.1rem .45rem;font-weight:750;font-size:.8rem;color:#fff;white-space:nowrap}
.gl{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.gl .lv{font-size:1.6rem;font-weight:800;letter-spacing:-.03em}
.mini{display:flex;gap:.2rem;align-items:flex-end}
.mini>span{flex:1 1 0;border-radius:.45rem;font-size:.72rem;text-align:center;color:#fff;font-weight:750;line-height:1.3;padding:.15rem 0}
.big{font-size:2.8rem;font-weight:800;line-height:.95;letter-spacing:-.05em}
.wx{display:flex;align-items:center;gap:.7rem;min-width:0}
.wx2{display:flex;flex-direction:column;font-size:.92rem;line-height:1.3;min-width:0}
.bars{display:flex;align-items:flex-end;gap:1px;height:5rem;border-bottom:1px solid var(--line);position:relative}
.bars>span{flex:1 1 0;background:var(--info);border-radius:.15rem .15rem 0 0;min-height:1px}
.bars>span.rn{background:var(--s2)}.bars>span.fz{background:var(--ice)}.bars>span.z0{background:transparent}
.bars>.now{position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
.bx{display:flex;justify-content:space-between;font-size:.68rem;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:.9rem;padding:.55rem .85rem;font-weight:700;font-size:.88rem;cursor:pointer}
.btn.on,.btn.pri{background:var(--acc);color:#fff;border-color:transparent}
.btn.dng{background:var(--bad);color:#fff;border-color:transparent}
.bg{display:flex;flex-wrap:wrap;gap:.4rem}
.inp{border:1px solid var(--line);background:var(--card2);border-radius:.8rem;padding:.55rem .7rem;width:100%;-webkit-user-select:text;user-select:text}
.lnk{color:var(--acc);font-weight:700;text-decoration:none}
.chrono{font-size:3rem;font-weight:800;text-align:center;letter-spacing:-.04em;line-height:1}
.bigbtn{width:100%;padding:.95rem;font-size:1.15rem;font-weight:800;border-radius:1.1rem;border:0;color:#fff;background:var(--ok);cursor:pointer}
.bigbtn.stop{background:var(--bad)}
.rad{position:relative;overflow:hidden;border-radius:1rem;background:#cfd8e2;width:100%}
.rad img{position:absolute;max-width:none;-webkit-user-drag:none}
.rad .ov{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.radbar{display:flex;gap:.4rem;align-items:center}
.radbar input{flex:1}
.sl{display:grid;grid-template-columns:7rem 1fr 3.2rem;align-items:center;gap:.5rem;font-size:.86rem}
.sl input{width:100%}
.alrt{border-left:.3rem solid var(--bad);background:var(--card2);padding:.5rem .65rem;border-radius:.6rem;white-space:pre-line;font-size:.88rem}
.alrt.warn{border-color:var(--warn)}.alrt.yel{border-color:var(--yel)}.alrt.info{border-color:var(--info)}
/* Petits écrans (iPhone SE, petits Android) */
@media (orientation:portrait) and (max-height:720px){
  :root{--gap:.4rem}
  #app{padding-top:max(env(safe-area-inset-top),.4rem);padding-bottom:max(env(safe-area-inset-bottom),.4rem)}
  header{min-height:2.5rem}.clock{font-size:1.55rem}.ib{width:2.2rem;height:2.2rem}
  .card:not(.hero):not(#zones){padding:.5rem .65rem}
  .hero-top{padding:.5rem .7rem .45rem}.hero-lv{font-size:1.7rem}.hero-sub{margin-top:.1rem}
  .hero-bot{padding:.45rem .7rem .5rem;gap:.4rem}.hc .e{display:none}
  .stat .v{font-size:1.55rem;margin-top:0}.opt{display:none}
  .nb{padding:.25rem 0 .22rem}.nb svg{width:1.15rem;height:1.15rem}
}
/* Paysage et grands écrans */
@media (orientation:landscape) and (max-height:620px){
  html{font-size:calc(clamp(11px,min(1.75vw,3.2vh),17px)*var(--scale))}
  #app{display:grid;grid-template-columns:1.15fr 1fr 1fr;grid-template-rows:auto auto minmax(0,1fr) minmax(0,1fr) auto auto;
    grid-template-areas:"hdr hdr hdr" "chips chips chips" "hero notes co" "hero sn dy" "zones zones zones" "nav nav nav"}
  .opt{display:none}.stat .v{font-size:1.6rem;margin-top:0}
  .row2{display:contents}
  header{grid-area:hdr}#chips{grid-area:chips}#hero{grid-area:hero}#zones{grid-area:zones}#notes{grid-area:notes}#t-sn{grid-area:sn}#t-co{grid-area:co}#t-dy{grid-area:dy}#ftr{grid-area:nav}
  #zones{grid-template-columns:repeat(14,minmax(0,1fr))}
  .hero-bot{flex:1;justify-content:space-evenly}.hc .e{display:none}
}
@media (min-width:820px) and (min-height:621px){
  html{font-size:calc(clamp(14px,min(1.5vw,1.85vh),20px)*var(--scale))}
  #app{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto auto minmax(0,1fr) auto auto;
    grid-template-areas:"hdr hdr" "chips chips" "hero mid" "zones duo" "nav nav";
    padding-left:max(env(safe-area-inset-left),calc((100vw - 1100px)/2),1.2rem);padding-right:max(env(safe-area-inset-right),calc((100vw - 1100px)/2),1.2rem)}
  header{grid-area:hdr}#chips{grid-area:chips}#hero{grid-area:hero}#zones{grid-area:zones}#mid{grid-area:mid}#duo{grid-area:duo}#ftr{grid-area:nav}
  .hero-bot{flex:1;justify-content:space-evenly}
  #ov{align-items:center;padding:1rem}.mo{border-radius:1.5rem}
}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <div id="chips" data-act="alerts"></div>
  <section class="card hero l0" id="hero" data-act="m-glide"></section>
  <div class="card" id="zones"></div>
  <div class="row2" id="mid">
    <section class="card" id="notes" data-act="m-pistes"></section>
    <section class="card stat" id="t-sn" data-act="m-snow"></section>
  </div>
  <div class="row2" id="duo">
    <section class="card stat" id="t-co" data-act="m-cold"></section>
    <section class="card stat" id="t-dy" data-act="m-day"></section>
  </div>
  <nav id="ftr"></nav>
</div>
<div id="ov"><div class="mo"><div class="mh"><span id="mt"></span><button data-act="close" aria-label="Fermer">✕</button></div><div class="mb" id="mb"></div></div></div>

<script>
'use strict';
/* =====================================================================
   GLISSADES DES PAYS D'EN HAUT — OUTIL D'INFO TERRAIN (employés)
   Un seul fichier, aucune dépendance. Sources (gratuites, sans clé) :
   - Site officiel (API WordPress) : état et vitesse de glisse par zone
   - Open-Meteo : météo horaire au point exact du Domaine
   - Environnement Canada (MSC GeoMet) : alertes, prévisions texte, radar
   ===================================================================== */
const CFG = {
  lat: 45.8847, lon: -74.1234, tz: 'America/Toronto',
  ecCity: 'qc-c3',                         // Saint-Sauveur (page-ville ECCC)
  bbox: '-74.20,45.85,-74.05,45.92',        // zone d'alertes autour de Piedmont
  site: 'https://domainedespaysdenhaut.com/wp-json/wp/v2/pages?slug=les-glissades&_fields=modified_gmt,content',

    if (sn.start) A.push('Neige dès ' + hh(sn.start) + ' (≈ ' + cm(sn.n12) + ' en 12 h)');
    if (sn.refreeze) A.push('Regel vers ' + hh(sn.refreeze) + ' : surfaces mouillées glacées (pic à glace / pelle)');
    if (sn.frzNext && !sn.frzNow) A.push('Verglas prévu dans les 12 h (pic à glace / pelle)');
    if (sn.poudNext) A.push('Poudrerie possible vers ' + hh(sn.poudNext));

  }

  if (hi) {

    const fut = H.filter(x => x.t > now && x.t <= now + 12 * HOUR && x.T != null);
    let w = null; for (const x of fut) { const v = windChill(x.T, x.ws); if (w == null || v < w.v) w = {v, t:x.t}; }
    co.worst = w; co.uv = c.uv; co.uvmax = V.today.uv != null ? V.today.uv : maxK(H.filter(x => ymd(x.t) === dk), 'uv');

  if (!sc) { const n = nextOpen(now); dy.state = 'Hors saison'; dy.cls = 'mutebg'; dy.txt = n ? (n.tbc ? 'Ouverture de la saison à confirmer' : 'Prochaine ouverture : ' + dateTxt(n.om)) : 'Saison terminée'; }
  else if (sc.o == null) { const n = nextOpen(now); dy.state = 'Fermé auj.'; dy.cls = 'mutebg'; dy.txt = n ? 'Prochaine ouverture : ' + dateTxt(n.om) + ' ' + n.o + ' h' : ''; }
  else if (now < sc.om) { dy.state = 'Avant ouverture'; dy.cls = 'info'; dy.lbl = 'Ouverture dans'; dy.cd = dur(sc.om - now); }
  else if (now < sc.fm) { dy.state = 'Ouvert'; dy.cls = 'ok'; dy.lbl = 'Fermeture dans'; dy.cd = dur(sc.fm - now); }
  else { const n = nextOpen(now); dy.state = 'Terminé'; dy.cls = 'mutebg'; dy.lbl = 'Prochaine ouverture'; dy.cd = n ? (ymd(n.om) === ymd(now + 24 * HOUR) ? 'demain ' + n.o + ' h' : dateTxt(n.om)) : '—'; }
  if (V.set) dy.light = {lbl:'Coucher · noirceur', v:hm(V.set) + ' · ' + hm(V.set + 30 * 60000)};
  /* Fabrication de neige : se fait la nuit, de la fermeture à l'ouverture du lendemain */
  if (hi) {
    dy.tw = wetBulb(V.cur.T, V.cur.RH);
    const p0 = lp(now), oT = sc && sc.om ? sc.om : localMs(p0.y, p0.mo, p0.d, 9, 0), cT = sc && sc.fm ? sc.fm : localMs(p0.y, p0.mo, p0.d, 17, 0);
    let st, en;

    else { st = Math.max(now, cT); const q = lp(now + 24 * HOUR), ns = schedMs(localMs(q.y, q.mo, q.d, 12, 0)); en = ns && ns.om ? ns.om : localMs(q.y, q.mo, q.d, 8, 0); }
    const nh = H.filter(x => x.t >= Math.floor(st / HOUR) * HOUR && x.t < en).map(x => ({t:x.t, tw:wetBulb(x.T, x.RH)})).filter(x => x.tw != null);
    const good = nh.filter(x => x.tw <= -4), exc = nh.filter(x => x.tw <= -7);

      good.length >= 2 ? {n:'Partielle', cls:'c-warn'} : nh.some(x => x.tw <= -2) ? {n:'Marginale', cls:'c-warn'} : {n:'Impossible', cls:'mute'};
    dy.night = {st, en, q, hours:nh, win:good.length ? hh(good[0].t) + ' → ' + hh(good[good.length - 1].t + HOUR) : null};

  /* Glisse sur les heures d'ouverture du jour (sinon les 9 prochaines heures) */
  if (V.glideH && V.glideH.length) {
    let tl = (sc && sc.om != null && now < sc.fm) ? V.glideH.filter(x => x.t >= (now < sc.om ? sc.om : now - HOUR) && x.t < sc.fm) : [];
    V.glDayOpen = tl.length > 1;
    if (!V.glDayOpen) tl = V.glideH.slice(0, 9);

  }
  /* Site officiel : état des zones seulement (les vitesses viennent de la météo) */

  }

    return Object.assign({}, z, {live, es, est:es != null ? glv(es) : null, est3:g3 ? glv(adj(g3.s, z.dv)) : null,

  if (V.cur) {
    const c = V.cur, sn = V.snow || {};

    if (sn.snowing) ch.push({cls:'info', txt:'❄ Neige en cours' + (c.sn >= 0.1 ? ' ' + cm(c.sn) + '/h' : '')});
    else if (sn.start && sn.start - now <= 6 * HOUR) ch.push({cls:'info', txt:'❄ Neige dès ' + hh(sn.start)});
    if (sn.rainNow && !sn.frzNow) ch.push({cls:'info', txt:'🌧 Pluie'});
    if (sn.refreeze) ch.push({cls:'warn', txt:'🧊 Regel ' + hh(sn.refreeze)});
    if (sn.poudNow) ch.push({cls:'warn', txt:'💨 Poudrerie'});

/* ===================== Déductions pour la journée aux Glissades ===================== */
function plan(V, H, now) {
  const g = V.glide, sn = V.snow || {}, c = V.cur, dy = V.day || {}, sc = dy.s;
  const close = sc && sc.fm ? sc.fm : now + 8 * HOUR;
  const work = H.filter(x => x.T != null && x.t >= now - HOUR && x.t <= Math.max(close, now + 4 * HOUR));
  /* Heures où la peau exposée peut geler en moins de 30 min (ressenti ≤ −28) */
  const fz = work.filter(x => x.t >= now - HOUR && Math.round(windChill(x.T, x.ws)) <= -28);
  V.frost = fz.length ? hh(fz[0].t) + ' → ' + hh(fz[fz.length - 1].t + HOUR) : 'aucune';
  /* Achalandage prévu (type de journée + météo pendant les heures d'ouverture) */

  if (sc && sc.o != null) {
    const p = lp(now), note = sc.note || '';
    let b, why;
    if (/Fêtes/.test(note)) { b = 85; why = 'Temps des Fêtes'; }
    else if (/relâche/.test(note)) { b = 90; why = 'Semaine de relâche'; }
    else if (p.wd === 6) { b = 75; why = 'Samedi'; }
    else if (p.wd === 0) { b = 65; why = 'Dimanche'; }
    else if (p.mo === 12 && p.d >= 20) { b = 50; why = 'Vacances scolaires'; }
    else { b = 25; why = 'Jour de semaine (groupes scolaires possibles)'; }
    if (sc.tbc) { b -= 10; why += ', début de saison'; }
    const oh = H.filter(x => x.T != null && x.t >= sc.om && x.t < sc.fm), A = [];
    if (oh.length) {
      const feel = oh.reduce((a, x) => a + windChill(x.T, x.ws), 0) / oh.length, Tm = oh.reduce((a, x) => a + x.T, 0) / oh.length;
      const sun = oh.filter(x => x.cc != null && x.cc < 50).length / oh.length, snow = sumK(oh, 'sn') || 0;
      if (oh.some(x => FRZ.includes(x.wc))) A.push(['verglas', -35]);
      else if (oh.some(x => (x.rain || 0) >= 0.3 && x.T > 0)) A.push(['pluie', -30]);
      if (feel <= -25) A.push(['grand froid', -25]); else if (feel <= -18) A.push(['froid', -12]);
      if (snow >= 8) A.push(['tempête, routes', -12]);
      if (Tm > 6) A.push(['neige molle', -10]);
      if (!A.length && feel > -15 && Tm < 3 && sun >= 0.5) A.push(['beau temps', 8]);
    }
    const s = clamp(b + A.reduce((a, x) => a + x[1], 0), 0, 100);
    V.crowd = Object.assign(s < 30 ? {n:'Faible', cls:'ok'} : s < 55 ? {n:'Modéré', cls:'yel'} : s < 78 ? {n:'Élevé', cls:'warn'} : {n:'Très élevé', cls:'bad'},
      {s, why:why + (A.length ? ' · ' + A.map(x => x[0]).join(', ') : ''), peak:'11 h – 14 h' + (sc.f >= 20 ? ' et 18 h – 20 h' : '')});
  }
  /* Pistes et équipements : conditions prévues, par importance */
  const P = [], add = (pr, ico, txt) => P.push({p:pr, ico, txt});
  const later = (V.glDay || []).filter(x => x.t > now);
  if (g) {
    if (g.ice) add(1, '🧊', 'Pistes glacées : glisse très rapide jusqu\'en fin de piste');
    else if (g.lv.k === 4) add(1, '⚡', 'Glisse très rapide : les embarcations vont plus loin en fin de piste');
    else { const f = later.find(x => x.lv.k === 4 || x.ice); if (f) add(2, '⚡', 'Glisse très rapide dès ' + hh(f.t)); }
  }
  if ((sn.rate || 0) >= 0.3) add(1, '❄️', 'Neige ' + cm(sn.rate) + '/h : couloirs et sorties de tapis se recouvrent' + (sn.rate >= 1 ? ' rapidement' : ''));
  else if (sn.start && sn.start < close) add(2, '❄️', 'Neige dès ' + hh(sn.start) + ' : la glisse va ralentir');
  if ((sn.p6 || 0) >= 2) add(1, '🚜', 'Neige fraîche ' + cm(sn.p6) + ' en 6 h : couloirs mous, glisse ralentie');
  else if ((sn.p24 || 0) >= 3) add(2, '🚜', cm(sn.p24) + ' tombés en 24 h : couloirs plus lents');
  const gx = Math.max(c && c.wg || 0, maxK(work.filter(x => x.t <= close), 'wg') || 0);
  if (gx >= 60) add(1, '💨', 'Rafales jusqu\'à ' + n0(gx) + ' km/h : télérafting, tubes et objets légers exposés');
  if (c && (c.ws || 0) >= 35 && ((sn.p24 || 0) >= 1 || sn.snowing)) add(2, '💨', 'Neige soufflée : accumulations possibles dans les couloirs, bermes et quais');

  if (!sn.rainNow && work.some(x => x.t > now && x.t < close && x.T > 1 && (x.sw || 0) > 300)) add(3, '☀️', 'Neige molle en après-midi : ornières et bosses probables');
  if (V.set && sc && sc.fm && sc.fm > V.set) add(3, '🌙', 'Noirceur vers ' + hm(V.set + 30 * 60000) + ', ouvert jusqu\'à ' + sc.f + ' h');
  if (dy.night && dy.night.q && dy.night.win) add(3, '🌨️', 'Fabrication de neige cette nuit : ' + dy.night.q.n.toLowerCase() + ' (' + dy.night.win + ')');
  if (!P.length && c) add(3, '✓', 'Conditions stables');

}

  if (log.length) h += '<h4>Mesures chrono récentes</h4>' + log.map(e => R(hm(e.t), (e.kmh ? n0(e.kmh) + ' km/h' : '') + (e.s ? ' · ' + e.s.toFixed(1).replace('.', ',') + ' s' : ''))).join('');
  h += '<button class="btn pri" data-act="chrono" data-id="' + z.id + '">⏱ Chronométrer cette zone</button>';
  openModal('Zone ' + z.nom.replace('Parc du ', ''), h);
}

/* ===================== Chrono / mesure de vitesse ===================== */
const CH = {run:false, t0:0, el:0, raf:0, zone:null};
function chronoView() {
  const log = LS.get('gpdh.log', []), dist = LS.get('gpdh.dist', {}), z = CH.zone || 'toboggan', d = dist[z] || '';
  const s = CH.el / 1000, k0 = d && s > 0 ? (d / s) * 3.6 : null, kmh = k0 && k0 <= 150 ? k0 : null;
  return '<div class="sl" style="grid-template-columns:5rem 1fr"><span>Zone</span><select id="chZ" class="inp">' + ZONES.map(x => '<option value="' + x.id + '"' + (x.id === z ? ' selected' : '') + '>' + esc(x.nom) + '</option>').join('') + '</select></div>' +
    '<div class="sl" style="grid-template-columns:5rem 1fr"><span>Distance (m)</span><input id="chD" class="inp" type="number" inputmode="decimal" placeholder="longueur mesurée" value="' + esc(d) + '"></div>' +
    '<div class="chrono" id="chT">' + s.toFixed(2).replace('.', ',') + ' s</div><div style="text-align:center;font-weight:850;font-size:1.2rem" id="chK">' + (kmh ? n0(kmh) + ' km/h' : k0 ? '<span class="c-bad">Valeur improbable (distance ou temps)</span>' : '— km/h') + '</div>' +
    '<button class="bigbtn' + (CH.run ? ' stop' : '') + '" data-act="chGo">' + (CH.run ? 'ARRIVÉE ■' : 'DÉPART ▶') + '</button>' +
    '<div class="bg"><button class="btn" data-act="chReset">Réinitialiser</button><button class="btn pri" data-act="chSave">Enregistrer</button>' +
    '<input id="chR" class="inp" style="flex:1;width:auto" type="number" inputmode="decimal" placeholder="ou vitesse radar km/h"></div>' +
    '<h4>Journal (appareil)</h4>' + (log.length ? log.slice(0, 6).map(e => R(hm(e.t) + ' · ' + esc((ZONES.find(x => x.id === e.z) || {}).nom || e.z), (e.kmh ? n0(e.kmh) + ' km/h' : '—') + (e.s ? ' · ' + e.s.toFixed(1).replace('.', ',') + ' s' : ''))).join('') +
      '<button class="btn" data-act="chClear">Effacer le journal</button>' : '<p class="mute">Aucune mesure. Entrez la longueur de la piste une fois : elle est mémorisée par zone.</p>');
}
function openChrono(zone) { if (zone) CH.zone = zone; openModal('Chrono de descente', chronoView()); }
function chTick() {
  CH.el = performance.now() - CH.t0; const el = $('#chT'); if (el) el.textContent = (CH.el / 1000).toFixed(2).replace('.', ',') + ' s';
  if (CH.run) CH.raf = requestAnimationFrame(chTick);
}
function chSyncInputs() {
  const zs = $('#chZ'), ds = $('#chD'); if (zs) CH.zone = zs.value;
  if (ds) { const dist = LS.get('gpdh.dist', {}); const v = num(ds.value); if (v) dist[CH.zone] = v; else delete dist[CH.zone]; LS.set('gpdh.dist', dist); }
}

/* ===================== Radar ===================== */
const RD = {z:8, layer:null, frames:[], i:0, timer:0, imgs:[]};
function stopRadar() { clearInterval(RD.timer); RD.timer = 0; }
function mercPx(lat, lon, z) { const s = 256 * Math.pow(2, z), r = lat * Math.PI / 180; return [(lon + 180) / 360 * s, (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * s]; }
function openRadar() {
  if (!RD.layer) RD.layer = (VM.cur && VM.cur.T != null && VM.cur.T > 1) ? 'RADAR_1KM_RRAI' : 'RADAR_1KM_RSNO';
  openModal('Radar · précipitations', '<div class="rad" id="rad"></div><div class="radbar"><button class="btn" data-act="rz" data-v="-1">−</button><button class="btn" data-act="rplay" id="rplay">❚❚</button>' +
    '<input type="range" id="rT" min="0" max="0" value="0"><span id="rL" style="font-weight:850;min-width:3.2rem;text-align:right">—</span><button class="btn" data-act="rz" data-v="1">+</button></div>' +
    '<div class="bg"><button class="btn' + (RD.layer === 'RADAR_1KM_RSNO' ? ' on' : '') + '" data-act="rlayer" data-v="RADAR_1KM_RSNO">❄ Neige</button><button class="btn' + (RD.layer === 'RADAR_1KM_RRAI' ? ' on' : '') + '" data-act="rlayer" data-v="RADAR_1KM_RRAI">🌧 Pluie</button></div>' +
    '<p class="mute" style="font-size:.64rem">Cercles : 25 et 50 km autour du Domaine (📍). Dernière heure, images aux 6 min. Radar © ECCC GeoMet · fond de carte © Esri, © OpenStreetMap.</p>');
  drawRadar();
}
async function drawRadar() {
  stopRadar();
  const box = $('#rad'); if (!box) return;
  const W = box.clientWidth, Hh = Math.round(Math.min(W, innerHeight * 0.56)); box.style.height = Hh + 'px';
  const z = RD.z, [px, py] = mercPx(CFG.lat, CFG.lon, z), x0 = px - W / 2, y0 = py - Hh / 2, n = Math.pow(2, z);
  let h = '';
  for (let tx = Math.floor(x0 / 256); tx <= Math.floor((x0 + W) / 256); tx++) for (let ty = Math.floor(y0 / 256); ty <= Math.floor((y0 + Hh) / 256); ty++) {
    if (ty < 0 || ty >= n) continue; const sx = ((tx % n) + n) % n;
    h += '<img alt="" src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/' + z + '/' + ty + '/' + sx + '" ' +
      'onerror="this.onerror=null;this.src=\'https://tile.openstreetmap.org/' + z + '/' + sx + '/' + ty + '.png\'" style="left:' + Math.round(tx * 256 - x0) + 'px;top:' + Math.round(ty * 256 - y0) + 'px;width:256px;height:256px">';
  }
  const R0 = 6378137, S = 2 * Math.PI * R0, m = v => v / (256 * n) * S;
  const bb = [m(x0) - S / 2, S / 2 - m(y0 + Hh), m(x0 + W) - S / 2, S / 2 - m(y0)].map(v => v.toFixed(0)).join(',');
  const res = S * Math.cos(CFG.lat * Math.PI / 180) / (256 * n), r25 = 25000 / res, r50 = 50000 / res;
  h += '<div id="radL" class="ov"></div><svg class="ov" width="' + W + '" height="' + Hh + '"><g fill="none" stroke="#d02c24" stroke-width="1.5" stroke-dasharray="4 4" opacity=".75"><circle cx="' + W / 2 + '" cy="' + Hh / 2 + '" r="' + r25 + '"/><circle cx="' + W / 2 + '" cy="' + Hh / 2 + '" r="' + r50 + '"/></g>' +
    '<text x="' + (W / 2 + 4) + '" y="' + (Hh / 2 - r25 + 12) + '" font-size="10" fill="#d02c24">25 km</text><text x="' + (W / 2 + 4) + '" y="' + (Hh / 2 - r50 + 12) + '" font-size="10" fill="#d02c24">50 km</text></svg>' +
    '<div class="ov" style="display:grid;place-items:center;font-size:1.3rem;margin-top:-1.2rem">📍</div>';
  box.innerHTML = h;
  let frames = [];
  try {
    const xml = await fetch('https://geo.weather.gc.ca/geomet?service=WMS&version=1.3.0&request=GetCapabilities&layer=' + RD.layer, {cache:'no-store'}).then(r => r.text());
    const dm = /<Dimension[^>]*name="time"[^>]*>([^<]+)<\/Dimension>/i.exec(xml);
    if (dm) { const [a, b] = dm[1].trim().split('/'), end = Date.parse(b), st = Date.parse(a); for (let k = 9; k >= 0; k--) { const t = end - k * 6 * 60000; if (t >= st) frames.push(t); } }
  } catch (e) {}
  if (!$('#rad')) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), base = 'https://geo.weather.gc.ca/geomet?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&FORMAT=image/png&TRANSPARENT=TRUE&STYLES=&CRS=EPSG:3857&LAYERS=' + RD.layer +
    '&WIDTH=' + Math.round(W * dpr) + '&HEIGHT=' + Math.round(Hh * dpr) + '&BBOX=' + bb;
  if (!frames.length) frames = [null];
  RD.frames = frames; RD.i = frames.length - 1;
  const L = $('#radL');
  L.innerHTML = frames.map((t, i) => '<img alt="" src="' + base + (t ? '&TIME=' + new Date(t).toISOString().replace('.000', '') : '') + '" style="left:0;top:0;width:' + W + 'px;height:' + Hh + 'px;opacity:.85;display:' + (i === RD.i ? 'block' : 'none') + '">').join('');
  RD.imgs = [...L.querySelectorAll('img')];
  const sl = $('#rT'); sl.max = frames.length - 1; sl.value = RD.i;
  sl.oninput = () => { stopRadar(); $('#rplay').textContent = '▶'; showFrame(+sl.value); };
  showFrame(RD.i);
  if (frames.length > 1) playRadar();
}
function showFrame(i) {
  RD.i = i; RD.imgs.forEach((im, j) => im.style.display = j === i ? 'block' : 'none');
  const t = RD.frames[i], l = $('#rL'), s = $('#rT'); if (l) l.textContent = t ? hm(t) : 'récent'; if (s) s.value = i;
}
function playRadar() {
  stopRadar(); let hold = 0; const b = $('#rplay'); if (b) b.textContent = '❚❚';
  RD.timer = setInterval(() => { if (!$('#rad')) return stopRadar(); if (RD.i === RD.frames.length - 1 && hold++ < 3) return; hold = 0; showFrame((RD.i + 1) % RD.frames.length); }, 450);
}

/* ===================== Réglages et DEV ===================== */
function mSettings() {
  const b = (act, v, cur, lbl) => '<button class="btn' + (cur ? ' on' : '') + '" data-act="' + act + '" data-v="' + v + '">' + lbl + '</button>';
  let h = '<h4>Thème</h4><div class="bg">' + b('theme', 'auto', SET.theme === 'auto', 'Auto (soleil)') + b('theme', 'light', SET.theme === 'light', 'Clair') + b('theme', 'dark', SET.theme === 'dark', 'Sombre') + '</div>' +
    '<h4>Taille du texte</h4><div class="bg">' + b('scale', '-', false, 'A−') + '<span style="align-self:center;font-weight:850;min-width:3rem;text-align:center">' + Math.round(SET.scale * 100) + ' %</span>' + b('scale', '+', false, 'A+') + b('scale', '1', false, 'Défaut') + '</div>' +
    '<h4>Actualisation automatique</h4><div class="bg">' + [5, 10, 15, 30].map(m => b('refint', m, SET.refresh === m, m + ' min')).join('') + '</div>' +
    '<h4>Liens</h4><p><a class="lnk" href="' + CFG.siteWeb + '" target="_blank" rel="noopener">Site officiel ↗</a> · <a class="lnk" href="' + CFG.horaireWeb + '" target="_blank" rel="noopener">Horaire ↗</a> · ' +
    '<a class="lnk" href="https://meteo.gc.ca/fr/location/index.html?coords=45.885,-74.123" target="_blank" rel="noopener">Météo Canada ↗</a> · <a class="lnk" href="https://www.quebec511.info/" target="_blank" rel="noopener">Québec 511 ↗</a></p>' +
    '<h4>Données</h4><div class="bg"><button class="btn" data-act="clearCache">Vider le cache</button><button class="btn" data-act="chClear">Effacer journal chrono</button></div>' +
    '<h4>Développeur</h4><div class="bg"><button class="btn dng" data-act="dev">DEV</button></div>' +
    '<p class="mute" style="font-size:.66rem">Version ' + CFG.version + ' · Sources : site du Domaine des Pays d\'en Haut, Open-Meteo, Environnement et Changement climatique Canada. Outil indicatif.</p>';
  openModal('Réglages', h);
}
function mDevCode() {
  openModal('Code développeur', '<p>Entrer le code pour activer le mode DEV (simulation de conditions, voyage dans le temps, diagnostic).</p>' +
    '<input id="devCode" class="inp" type="text" autocapitalize="characters" autocomplete="off" placeholder="Code">' +
    '<div class="bg"><button class="btn pri" data-act="devOk">Valider</button><button class="btn" data-act="settings">Retour</button></div><p id="devMsg" class="c-bad"></p>');
  setTimeout(() => { const i = $('#devCode'); if (i) i.focus(); }, 50);
}
function mDev() {
  const sc = SCEN[DEV.scen] || SCEN.parfaite, T = DEV.T != null ? DEV.T : sc.T, ws = DEV.ws != null ? DEV.ws : sc.ws, wg = DEV.wg != null ? DEV.wg : sc.wg;
  const sl = (id, lbl, min, max, step, v, unit) => '<div class="sl"><span>' + lbl + '</span><input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + v + '"><b id="' + id + 'V">' + v + unit + '</b></div>';
  const st = k => D.err[k] ? '<b class="c-bad">erreur</b> <span class="mute">' + esc(D.err[k]).slice(0, 60) + '</span>' : D[k] ? '<b class="c-ok">OK</b> <span class="mute">' + hm(D[k].t) + '</span>' : '<span class="mute">—</span>';
  const shiftTxt = DEV.shift ? (DEV.shift > 0 ? '+' : '\u2212') + dur(Math.abs(DEV.shift)) : 'aucun';
  let h = '<div class="bg"><button class="btn' + (DEV.sim ? ' on' : '') + '" data-act="devSim">Simulation : ' + (DEV.sim ? 'ACTIVE' : 'inactive') + '</button>' +
    '<button class="btn' + (DEV.siteOpen ? ' on' : '') + '" data-act="devSite">Site simulé : ' + (DEV.siteOpen ? 'ouvert' : 'fermé') + '</button></div>' +
    '<h4>Scénarios</h4><div class="bg">' + Object.keys(SCEN).map(k => '<button class="btn' + (DEV.scen === k ? ' on' : '') + '" data-act="devScen" data-v="' + k + '">' + SCEN[k].nom + '</button>').join('') + '</div>' +
    '<h4>Réglages fins</h4>' + sl('dvT', 'Température', -45, 15, 1, Math.round(T), '°') + sl('dvW', 'Vent', 0, 90, 1, ws, '') + sl('dvG', 'Rafales', 0, 120, 1, wg, '') + sl('dvS', 'Neige ×', 0, 4, 0.5, DEV.snx, '') +
    '<h4>Voyage dans le temps (décalage : ' + shiftTxt + ')</h4><div class="bg">' + [['-24', '−24 h'], ['-1', '−1 h'], ['1', '+1 h'], ['24', '+24 h'], ['168', '+7 j']].map(([v, l]) => '<button class="btn" data-act="devShift" data-v="' + v + '">' + l + '</button>').join('') +
    '<button class="btn" data-act="devJan">Samedi 16 janv. 14 h</button><button class="btn" data-act="devShift" data-v="0">Maintenant</button></div>' +
    '<h4>Diagnostic des sources</h4>' + R('Open-Meteo', st('om')) + R('ECCC page-ville', st('ec')) + R('ECCC alertes', st('al')) + R('Site officiel', st('site')) +
    '<div class="bg"><button class="btn" data-act="refresh">Recharger tout</button><button class="btn" data-act="devLock">Verrouiller DEV</button></div>';
  openModal('DEV · mode test', h);
  const bind = (id, key, unit) => { const el = $('#' + id); if (!el) return; el.oninput = () => { DEV[key] = +el.value; $('#' + id + 'V').textContent = el.value + unit; saveDev(); if (DEV.sim) render(); }; };
  bind('dvT', 'T', '°'); bind('dvW', 'ws', ''); bind('dvG', 'wg', ''); bind('dvS', 'snx', '');
}

/* ===================== Événements ===================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === 'close' || (el.id === 'ov' && e.target === el)) return closeModal();
  switch (a) {
    case 'refresh': fetchAll(); break;
    case 'settings': mSettings(); break;
    case 'm-wx': mWx(); break;
    case 'm-glide': mGlide(); break;
    case 'm-snow': mSnow(); break;
    case 'm-cold': mCold(); break;
    case 'm-day': mDay(); break;
    case 'm-hours': mHours(); break;
    case 'm-pistes': mPistes(); break;
    case 'alerts': mAlerts(); break;
    case 'zone': e.stopPropagation(); mZone(el.dataset.id); break;
    case 'radar': openRadar(); break;
    case 'rz': RD.z = clamp(RD.z + (+v), 6, 11); drawRadar(); break;
    case 'rplay': if (RD.timer) { stopRadar(); el.textContent = '▶'; } else playRadar(); break;
    case 'rlayer': RD.layer = v; openRadar(); break;
    case 'chrono': openChrono(el.dataset.id); break;
    case 'chGo':
      chSyncInputs();
      if (!CH.run) { CH.run = true; CH.t0 = performance.now(); CH.el = 0; openChrono(); chTick(); }
      else { CH.run = false; cancelAnimationFrame(CH.raf); CH.el = performance.now() - CH.t0; openChrono(); }
      break;
    case 'chReset': CH.run = false; cancelAnimationFrame(CH.raf); CH.el = 0; chSyncInputs(); openChrono(); break;
    case 'chSave': {
      chSyncInputs(); const dist = LS.get('gpdh.dist', {})[CH.zone], r = num(($('#chR') || {}).value), s = CH.el / 1000;
      let kmh = r || (dist && s > 0 ? dist / s * 3.6 : null);
      if (kmh && kmh > 150) kmh = null;
      if (!kmh && !(s > 0)) break;
      const log = LS.get('gpdh.log', []); log.unshift({t:NOW(), z:CH.zone, s:s > 0 && !r ? s : null, kmh}); LS.set('gpdh.log', log.slice(0, 60));
      CH.el = 0; openChrono(); render(); break;
    }
    case 'chClear': LS.set('gpdh.log', []); render(); if ($('#chT')) openChrono(); else mSettings(); break;
    case 'theme': SET.theme = v; saveSet(); render(); mSettings(); break;
    case 'scale': SET.scale = v === '1' ? 1 : clamp(Math.round((SET.scale + (v === '+' ? 0.05 : -0.05)) * 100) / 100, 0.75, 1.3); saveSet(); render(); mSettings(); break;
    case 'refint': SET.refresh = +v; saveSet(); schedule(); mSettings(); break;
    case 'clearCache': ['gpdh.c.om', 'gpdh.c.ec', 'gpdh.c.al', 'gpdh.c.site'].forEach(LS.del); D.om = D.ec = D.al = D.site = null; render(); fetchAll(); mSettings(); break;
    case 'dev': if (DEV.unlocked) mDev(); else mDevCode(); break;
    case 'devOk': {
      const c = (($('#devCode') || {}).value || '').trim().toUpperCase();
      if (c === 'BURGER') { DEV.unlocked = true; saveDev(); mDev(); } else { const m = $('#devMsg'); if (m) m.textContent = 'Code invalide.'; }
      break;
    }
    case 'devSim': DEV.sim = !DEV.sim; saveDev(); render(); mDev(); break;
    case 'devSite': DEV.siteOpen = !DEV.siteOpen; saveDev(); render(); mDev(); break;
    case 'devScen': DEV.scen = v; DEV.T = DEV.ws = DEV.wg = null; DEV.snx = 1; DEV.sim = true; saveDev(); render(); mDev(); break;
    case 'devShift': DEV.shift = v === '0' ? 0 : (DEV.shift || 0) + (+v) * HOUR; saveDev(); render(); mDev(); break;
    case 'devJan': DEV.shift = localMs(2027, 1, 16, 14, 0) - Date.now(); DEV.sim = true; saveDev(); render(); mDev(); break;
    case 'devLock': DEV.unlocked = false; DEV.sim = false; DEV.shift = 0; saveDev(); render(); closeModal(); break;
  }
});
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); if (e.key === 'Enter' && $('#devCode')) $('[data-act="devOk"]').click(); });
document.addEventListener('change', e => { if (e.target.id === 'chZ') { CH.zone = e.target.value; openChrono(); } if (e.target.id === 'chD') chSyncInputs(); });

/* ===================== Démarrage ===================== */
let refreshTimer = 0;
function schedule() { clearInterval(refreshTimer); refreshTimer = setInterval(() => fetchAll(), SET.refresh * 60000); }
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => { fitNotes(); if ($('#rad')) drawRadar(); }, 150); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - D.last > 3 * 60000) fetchAll(); });
setInterval(() => { if (!document.hidden) render(); }, 30000);
render();
fetchAll();
schedule();
</script>
</body>
</html>
